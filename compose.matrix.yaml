services:
  nginx:
    volumes:
      - ./matrix/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./matrix/join.html:/srv/matrix-join.html:ro
    networks:
      matrix_backend: {}


  synapse:
    image: ${MEOW_IMAGE_PREFIX:-ghcr.io/m0nokey/meow-meow}-synapse:${MEOW_IMAGE_TAG:-latest}
    build:
      context: ./matrix/synapse
      additional_contexts:
        network_source: ./network
    environment:
      TZ: UTC
      SYNAPSE_LOG_LEVEL: WARNING
      SYNAPSE_REPORT_STATS: 'no'
    init: true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 96
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    ipc: none
    logging:
      driver: none
    volumes:
      - matrix_data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    networks:
      matrix_backend:
        aliases: [matrix-origin]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8008/health', timeout=3).close()"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  matrix-invite:
    image: ${MEOW_IMAGE_PREFIX:-ghcr.io/m0nokey/meow-meow}-synapse:${MEOW_IMAGE_TAG:-latest}
    profiles: [operator]
    user: '0:0'
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    ipc: none
    logging:
      driver: none
    volumes:
      - matrix_data:/data:ro
    networks: [matrix_backend]

networks:
  matrix_backend:
    driver: bridge
    internal: true
    enable_ipv6: false

volumes:
  matrix_data:
