worker_processes 1;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_user_agent $allowed_platform {
        default 0;
        ~*windows 0;
        ~*(macintosh|mac\s?os|macos|darwin|iphone|ipad|ipod|ios|android|linux) 1;
    }

    map $http_user_agent $allowed_element {
        default 0;
        "~^Element X/[0-9]+(?:\.[0-9]+)+ \((?:iPhone|iPad|iPod)[^;]*; (?:iOS|iPadOS) [0-9]+(?:\.[0-9]+)*; Scale/[0-9]+\.[0-9]+\)$" 1;
        "~^Element(?: X|-X|X)/[0-9]+(?:\.[0-9]+)+ \([^;]+; Android [0-9]+(?:\.[0-9]+)*; [A-Za-z0-9._-]+; Sdk [0-9a-f]{7,40}\)$" 1;
        "~^Mozilla/5\.0 \((?:X11; Linux (?:x86_64|aarch64)|Macintosh; (?:Intel |ARM )?Mac OS X [0-9_\.]+)\) AppleWebKit/[0-9.]+ \(KHTML, like Gecko\) Element/[0-9]+(?:\.[0-9]+)+(?:[-+][A-Za-z0-9.+-]+)? Chrome/[0-9.]+ Electron/[0-9.]+ Safari/[0-9.]+$" 1;
    }

    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        "" $remote_addr;
    }

    upstream synapse_backend {
        zone synapse_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server matrix-origin:8008 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 50m;
        error_page 404 /index.html;
        error_page 403 /index.html;
        proxy_hide_header Cache-Control;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;

        location = / {
            rewrite ^ /index.html last;
        }

        location = /index.html {
            internal;
            add_header Cache-Control "no-store" always;
            sub_filter '<head>' '<head><base href="/">';
        }

        location ^~ /css/ { try_files $uri =404; }
        location ^~ /icons/ { try_files $uri =404; }

        location = /join/ {
            if ($allowed_platform = 0) { return 404; }
            rewrite ^ /matrix-join.html last;
        }

        location = /matrix-join.html {
            internal;
            alias /srv/matrix-join.html;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /join/check {
            if ($allowed_platform = 0) { return 404; }
            if ($request_method != GET) { return 404; }
            add_header Cache-Control "private, no-store" always;
            proxy_pass http://synapse_backend/_matrix/client/v1/register/m.login.registration_token/validity;
        }

        location = /join/create {
            if ($allowed_platform = 0) { return 404; }
            if ($request_method != POST) { return 404; }
            add_header Cache-Control "private, no-store" always;
            proxy_pass http://synapse_backend/_matrix/client/v3/register;
        }

        location ~ ^/(?:_matrix/(?:client|media)/|\.well-known/matrix/client$) {
            if ($allowed_element = 0) { return 404; }

            add_header Cache-Control "private, no-store" always;
            proxy_pass http://synapse_backend;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location / { return 404; }
    }
}
