<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Create an account</title>
  <style>
    body { background: #1e1e1e; color: #fff; font: 1rem system-ui, sans-serif; margin: 3rem auto; padding: 0 1rem; max-width: 26rem; }
    label, input { display: block; margin: .5rem 0; }
    input, button { font: inherit; padding: .4rem; }
  </style>
</head>
<body>
  <main hidden>
    <h1>Create an account</h1>
    <form>
      <label>Username <input name="username" required autocomplete="username" pattern="[a-z0-9._\-]+" maxlength="64"></label>
      <label>Password <input name="password" type="password" required autocomplete="new-password" minlength="12"></label>
      <button>Create account</button>
    </form>
    <p role="status"></p>
  </main>
  <script>
    const token = location.hash.slice(1);
    history.replaceState(null, '', location.pathname);
    const main = document.querySelector('main');
    const form = document.querySelector('form');
    const status = document.querySelector('[role="status"]');
    const button = form.querySelector('button');

    async function openInvitation() {
      if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
        location.replace('/');
        return;
      }
      const response = await fetch('/join/check?' + new URLSearchParams({token}));
      if (!response.ok || !(await response.json()).valid) {
        location.replace('/');
        return;
      }
      main.hidden = false;
    }

    async function register(payload) {
      const response = await fetch('/join/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      return {ok: response.ok, result: await response.json()};
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = '';
      try {
        const {username, password} = Object.fromEntries(new FormData(form));
        const account = {username, password, inhibit_login: true};
        let {result} = await register(account);
        const supported = ['m.login.registration_token', 'm.login.dummy'];
        const stages = result.flows?.map(flow => flow.stages).find(flow =>
          flow.includes(supported[0]) && flow.every(stage => supported.includes(stage)));
        if (!stages || !result.session) {
          throw new Error(result.error || 'Could not start registration.');
        }
        let ok = false;
        for (const type of stages) {
          ({ok, result} = await register({...account, auth: {type, token, session: result.session}}));
          if (ok) break;
          if (!result.session) throw new Error(result.error || 'Registration failed.');
        }
        if (!ok) throw new Error(result.error || 'Registration failed.');
        form.reset();
        form.hidden = true;
        status.textContent = `Account created. In Element X choose ${location.origin} as your account provider and sign in as ${username}.`;
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    openInvitation().catch(() => location.replace('/'));
  </script>
</body>
</html>
