services:
  cloudflared:
    image: ${MEOW_IMAGE_PREFIX:-ghcr.io/m0nokey/meow-meow}-cloudflared-direct:${MEOW_IMAGE_TAG:-latest}
    build:
      target: direct
    user: '65534:65534'
    environment:
      MEOW_MODE: direct
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=1m,mode=0755,uid=65534,gid=65534
    networks:
      internal_network: {}
      external_network: {}

networks:
  internal_network:
    name: ${MEOW_PROJECT:-meow-meow}_direct_site
  external_network:
    name: ${MEOW_PROJECT:-meow-meow}_direct_uplink
    driver: bridge
