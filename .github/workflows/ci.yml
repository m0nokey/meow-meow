name: Meow Meow CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'rescan' || 'build' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE_REGISTRY: ghcr.io/m0nokey
  GRYPE_VERSION: v0.118.0

jobs:
  quality:
    name: Static validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Lint workflows and shell scripts
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y shellcheck
          fi
          GOBIN="$RUNNER_TEMP" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint" -color
          shellcheck -x -P SCRIPTDIR -S warning run.sh cloudflared/start-tunnel.sh \
            network/{tor,haproxy,runtime}/*.sh .github/scripts/{scan-images,test-stack}.sh

      - name: Validate both Compose configurations
        run: |
          for mode in direct tor; do
            docker compose --env-file .github/scripts/compose-test.env \
              -f compose.yaml -f "compose.$mode.yaml" config --format json |
              jq -e --arg mode "$mode" '
                all(.services[]; (.ports // []) == [] and .read_only and .logging.driver == "none")
                and .networks.internal_network.internal
                and ((.services.nginx.networks | keys) == ["internal_network"])
                and (if $mode == "direct" then
                  ((.services | keys) == ["cloudflared", "nginx"])
                  and ((.services.cloudflared.networks | keys) == ["external_network", "internal_network"])
                  and ((.services.cloudflared.cap_add // []) == [])
                else
                  ((.services | keys) == ["cloudflared", "haproxy", "nginx", "tor_a", "tor_b"])
                  and ((.services.cloudflared.networks | keys) == ["internal_network"])
                end)
              '
          done

      - name: Scan configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: .
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Scan for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, javascript-typescript]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}

  build-test-scan:
    name: Build, test and scan (${{ matrix.architecture }})
    if: github.event_name != 'schedule'
    needs: [quality, codeql]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and test both modes
        run: |
          bash .github/scripts/test-stack.sh direct
          bash .github/scripts/test-stack.sh tor

      - name: Download Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Scan images and enforce release gate
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: bash .github/scripts/scan-images.sh "$GRYPE" "$ARCHITECTURE" "$IMAGE_TAG" build

      - name: Write security summary
        if: always() && hashFiles('security-reports/**/*.sarif') != ''
        run: |
          python3 .github/scripts/security-summary.py security-reports/before-vex
          python3 .github/scripts/security-summary.py security-reports/verified

      - name: Upload security reports
        if: always() && hashFiles('security-reports/*.json') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: security-reports-${{ matrix.architecture }}
          path: security-reports/
          retention-days: 30

      - name: Export tested images
        if: github.ref == 'refs/heads/main'
        run: |
          source .github/scripts/images.sh
          refs=()
          for image in "${images[@]}"; do
            reference="$IMAGE_REGISTRY/meow-meow-$image:$IMAGE_TAG"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$reference")" = "linux/$ARCHITECTURE"
            refs+=("$reference")
          done
          docker save "${refs[@]}" | gzip -1 > "meow-meow-images-$ARCHITECTURE.tar.gz"

      - name: Upload architecture images
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: build-images-${{ matrix.architecture }}
          path: meow-meow-images-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-architecture images
    needs: build-test-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: build-images-*
          path: image-artifacts
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested architecture images and publish manifests
        run: |
          source .github/scripts/images.sh
          for architecture in amd64 arm64; do
            gzip -dc "image-artifacts/meow-meow-images-$architecture.tar.gz" | docker load
            for image in "${images[@]}"; do
              docker push "$IMAGE_REGISTRY/meow-meow-$image:$GITHUB_SHA-$architecture"
            done
          done
          for image in "${images[@]}"; do
            reference="$IMAGE_REGISTRY/meow-meow-$image"
            docker buildx imagetools create -t "$reference:$GITHUB_SHA" \
              "$reference:$GITHUB_SHA-amd64" "$reference:$GITHUB_SHA-arm64"
          done
          for image in "${images[@]}"; do
            reference="$IMAGE_REGISTRY/meow-meow-$image"
            docker buildx imagetools create -t "$reference:latest" "$reference:$GITHUB_SHA"
          done

  rescan-latest:
    name: Daily CVE scan (${{ matrix.architecture }})
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          source .github/scripts/images.sh
          for image in "${images[@]}"; do
            docker pull --platform "linux/$ARCHITECTURE" "$IMAGE_REGISTRY/meow-meow-$image:latest"
          done

      - name: Download Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Rescan with the current CVE database
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: bash .github/scripts/scan-images.sh "$GRYPE" "$ARCHITECTURE" latest latest

      - name: Write security summary
        if: always() && hashFiles('security-reports/**/*.sarif') != ''
        run: |
          python3 .github/scripts/security-summary.py security-reports/before-vex
          python3 .github/scripts/security-summary.py security-reports/verified

      - name: Upload security reports
        if: always() && hashFiles('security-reports/*.json') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: security-reports-${{ matrix.architecture }}
          path: security-reports/
          retention-days: 30

  upload-security-reports:
    name: Upload SARIF to Code scanning
    needs: [build-test-scan, rescan-latest]
    if: >-
      !cancelled() &&
      (needs.build-test-scan.result != 'skipped' || needs.rescan-latest.result != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: security-reports-*
          path: security-reports
          merge-multiple: true

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: hashFiles('security-reports/verified/*.sarif') != ''
        with:
          sarif_file: security-reports/verified
